# Pubblicazione su Netlify: sito statico, nessuna compilazione.
[build]
  publish = "."

# La pagina e il service worker non vanno tenuti in cache: così gli aggiornamenti arrivano subito
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
