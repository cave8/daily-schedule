<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Daily Schedule</title>
  <meta name="description" content="Il tuo assistente che organizza la giornata e la riorganizza quando cambia qualcosa.">
  <meta name="theme-color" content="#fafaf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Schedule">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden></div>
  <div class="shell">
    <nav class="tabs" aria-label="Sezioni">
      <div class="brand side-only"><span class="logo" aria-hidden="true"></span><span>Daily Schedule</span></div>
      <button data-tab="oggi"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span>Oggi</span></button>
      <button data-tab="assistente"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>Assistente</span></button>
      <button data-tab="calendario"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendario</span></button>
      <button data-tab="attivita"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M3.8 6.3l1.2 1.2 2-2.2M3.8 11.8 5 13l2-2.2M3.8 17.3 5 18.5l2-2.2"/></svg><span>Attività</span></button>
      <button data-tab="impostazioni"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><span>Impostazioni</span></button>
    </nav>
    <div class="content">
      <header class="top">
        <div class="brand mobile-only"><span class="logo" aria-hidden="true"></span>Daily Schedule</div>
        <div class="clock" id="clock"></div>
      </header>
      <main id="view" aria-live="polite"></main>
      <div class="composer" id="quick">
        <div class="quick-preview" id="quick-preview" hidden></div>
        <form id="quick-form" autocomplete="off">
          <button type="button" class="cbtn" data-act="add-menu" aria-label="Aggiungi con il modulo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <input id="quick-input" type="text" enterkeyhint="send" placeholder="Aggiungi… es. «Dentista domani alle 15»" aria-label="Scrivi all'assistente">
          <button type="submit" class="cbtn send" aria-label="Invia"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/time.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/areas.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/store.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/proposals.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/apple.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
